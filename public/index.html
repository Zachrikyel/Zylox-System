<!DOCTYPE html>

<body class="text-white h-screen w-screen overflow-hidden flex flex-col selection:bg-cyan-500/30">

    <div id="login-overlay"

        <div class="text-center max-w-sm p-8 relative z-10 glass-panel rounded-3xl border-0">
            <div
                class="w-16 h-16 mx-auto mb-6 bg-gradient-to-tr from-cyan-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <span class="text-3xl">🔐</span>
            </div>
            <h1 class="text-3xl font-black mb-2 tracking-tight text-white">ZYLOX SYSTEM</h1>
            <p class="text-zinc-500 mb-8 font-mono text-[10px] tracking-[0.2em] uppercase">Terminal de Acceso Seguro</p>

            <button onclick="loginWithGoogle()"
                class="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3.5 px-6 rounded-xl flex items-center justify-center gap-3 transition-all transform active:scale-95">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />

                </svg>
                <span id="login-btn-text">Iniciar Sesión</span>

        </div>
    </div>

    <div id="access-denied"
        class="fixed inset-0 hidden flex flex-col items-center justify-center denied-screen text-center p-6 cursor-not-allowed select-none">
        <div class="scan-line"></div>
        <div class="text-red-500 text-6xl mb-4 animate-pulse">🚫</div>
        <h1 class="text-4xl font-black text-red-600 tracking-widest mb-2">ACCESO DENEGADO</h1>
        <p class="text-red-400/70 font-mono text-sm mb-8 uppercase">Violación de protocolo de seguridad</p>

        <div
            class="bg-black/50 p-4 rounded border border-red-900/50 text-left font-mono text-xs text-red-300 w-full max-w-md">
            <p>USER_AGENT: <span class="text-white" id="denied-email">unknown</span></p>
            <p>UID_HASH: <span class="text-white" id="denied-uid">unknown</span></p>
            <p>STATUS: <span class="text-red-500 font-bold">REJECTED</span></p>
            <p class="mt-2 text-zinc-500">Este intento ha sido registrado. Salga inmediatamente.</p>
        </div>

    </div>

    <main id="main-dashboard"
        class="relative z-10 flex-1 flex flex-col w-full max-w-5xl mx-auto p-6 hidden opacity-0 transition-opacity duration-700">

        <header class="flex justify-between items-center h-20 mb-4 animate-fade-in-up">
            <div class="flex items-center gap-4">
                <div class="relative w-12 h-12 rounded-full overflow-hidden border border-white/10">
                    <img id="user-avatar-img" src="/api/drive-proxy?id=1XBMR8tr5FY3W0kMj5ZGyvmeULggui3n9"

                </div>
                <div>
                    <h2 class="text-sm font-bold text-white leading-none">Admin</h2>
                    <p id="user-email-display" class="text-xs text-cyan-400 font-mono mt-1">...</p>
                </div>
            </div>

            <button onclick="logout()"
                class="btn-logout px-4 py-2 rounded-lg flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    </path>
                </svg>
                Salir

        </header>

            <div id="home-view" class="animate-fade-in-up" style="animation-delay: 0.1s;">
                <h3 class="text-zinc-500 text-xs font-bold uppercase tracking-widest mb-6 border-b border-white/5 pb-2">
                    Herramientas</h3>

                <div class="grid grid-cols-4 gap-3 md:gap-6"> <button onclick="openTool('calculator')"
                        class="glass-panel aspect-square flex flex-col items-center justify-center gap-2 hover:bg-cyan-500/10 transition group">
                        <div
                            class="p-3 rounded-full bg-cyan-500/20 text-cyan-400 group-hover:scale-110 transition-transform">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <span class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">Calc 3D</span>
                    </button>

                    <button onclick="openTool('extractor')"
                        class="glass-panel aspect-square flex flex-col items-center justify-center gap-2 hover:bg-purple-500/10 transition group">
                        <div
                            class="p-3 rounded-full bg-purple-500/20 text-purple-400 group-hover:scale-110 transition-transform">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                                </path>

                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                                </path>
                            </svg>
                        </div>
                        <span class="text-[10px] font-bold text-zinc-600 uppercase tracking-wider">Clientes</span>
                    </button>

                    <button
                        class="glass-panel aspect-square flex flex-col items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                        <div class="p-3 rounded-full bg-zinc-800 text-zinc-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                            </svg>
                        </div>
                        <span class="text-[10px] font-bold text-zinc-600 uppercase tracking-wider">Stock</span>
                    </button>

                    <button class="glass-panel aspect-square opacity-20 border-dashed border-zinc-700"></button>
                    <button class="glass-panel aspect-square opacity-20 border-dashed border-zinc-700"></button>
                    <button class="glass-panel aspect-square opacity-20 border-dashed border-zinc-700"></button>

                </div>

                <div id="tool-view" class="hidden absolute inset-0 bg-[#050505] z-50 flex flex-col animate-fade-in-up">

                            VOLVER

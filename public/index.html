<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zylox System</title>
    <link rel="icon" type="image/png" href="/api/drive-proxy?id=14K0FNKNHvNvP5ysBu3o0p8slYA0ddNZf">

    <!-- Preconnect to CDNs for faster loading -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Critical CSS first -->
    <link rel="stylesheet" href="/core/styles.css">

    <!-- Fonts with display swap for non-blocking -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase - needed before auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body class="bg-void text-white h-screen w-screen overflow-hidden flex flex-col font-sans selection:bg-cyber/30">

    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[80%] h-[80%] bg-cyber/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[80%] h-[80%] bg-neo/5 rounded-full blur-[120px]"></div>
    </div>

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 hidden">
        <div class="glass-panel p-8 cyber-shape max-w-sm text-center">
            <h1 class="text-3xl font-black mb-1 text-white tracking-tighter">ZYLOX</h1>
            <p class="text-[10px] font-mono text-zinc-500 tracking-[0.3em] mb-8">SYSTEM ACCESS</p>
            <button onclick="loginWithGoogle()"
                class="w-full bg-white text-black font-bold py-4 px-6 hover:bg-zinc-200 transition-all flex items-center justify-center gap-2 cyber-shape">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z" />
                </svg>
                ACCESO GOOGLE
            </button>
        </div>
    </div>

    <div id="access-denied" class="fixed inset-0 z-[60] bg-black flex flex-col items-center justify-center hidden">
        <h1 class="text-4xl text-red-600 font-black tracking-widest glitch-text">BLOQUEADO</h1>
        <p class="font-mono text-red-900 mt-2 text-xs">UID NO AUTORIZADO</p>
    </div>

    <main id="main-dashboard"
        class="relative z-10 w-full h-full flex flex-col justify-center p-6 hidden max-w-md mx-auto md:max-w-4xl">

        <header class="flex justify-between items-center mb-8 shrink-0">
            <div>
                <h2 class="text-3xl font-black italic tracking-tighter text-white uppercase transform -skew-x-6">Zylox
                    <span class="text-cyber">System</span>
                </h2>
                <div class="h-1 w-12 bg-neo mt-1 cyber-shape"></div>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative w-10 h-10 border border-white/20 cyber-shape p-0.5">
                    <img id="user-avatar" src="" class="w-full h-full object-cover cyber-shape bg-black">
                </div>
                <button onclick="logout()"
                    class="w-10 h-10 bg-zinc-900 flex items-center justify-center text-zinc-500 hover:text-red-500 border border-white/5 cyber-shape transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="w-full">

            <div class="glass-panel cyber-shape p-1 pt-8 pb-8 px-6 bg-[#0a0a0a]/80">

                <div class="flex justify-center items-center mb-8 border-b border-white/5 pb-2">
                    <h3 class="text-sm font-bold text-zinc-400 uppercase tracking-[0.2em]">Mis Herramientas</h3>
                </div>

                <div id="tools-grid" class="flex flex-col items-center gap-6">
                </div>
            </div>

            <div class="mt-8 cyber-shape p-4 bg-zinc-900/50 border border-white/5 flex items-center gap-4">
                <div class="w-2 h-2 bg-neo rounded-full animate-ping"></div>
                <div>
                    <h4 class="text-xs font-bold text-white uppercase tracking-wider">Estado del Sistema</h4>
                    <p class="text-[10px] text-zinc-500 font-mono">Núcleo estable. 8 Módulos cargados.</p>
                </div>
            </div>

        </div>
    </main>

    <div id="stage-container" class="fixed inset-0 z-50 bg-[#050505] hidden flex flex-col">
        <div class="h-16 flex items-center justify-between px-4 shrink-0 bg-[#080808] border-b border-white/10">
            <!-- Botón Atrás (contextual) -->
            <button id="stage-back-btn" onclick="window.stageBack && window.stageBack()"
                class="w-10 h-10 cyber-shape bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-cyber transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <!-- Título Central -->
            <span id="stage-title" class="font-black text-lg text-white tracking-tighter uppercase italic">APP</span>

            <!-- Botones Derecha: Home Módulo + Cerrar -->
            <div class="flex items-center gap-2">
                <button id="stage-module-home" onclick="reloadCurrentModule()"
                    title="Menú del módulo"
                    class="w-10 h-10 cyber-shape bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-neo/20 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                </button>
                <button onclick="closeTool()" title="Cerrar herramienta"
                    class="w-10 h-10 cyber-shape bg-zinc-800 flex items-center justify-center text-zinc-400 hover:text-red-500 hover:bg-red-500/10 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="flex-1 relative">
            <div id="stage-loader" class="absolute inset-0 flex items-center justify-center">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-12 h-12 border-2 border-cyber border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs font-mono text-cyber animate-pulse">CARGANDO MODULO...</span>
                </div>
            </div>
            <iframe id="stage-frame" class="w-full h-full border-0"></iframe>
        </div>
    </div>

    <script src="/core/script.js"></script>
</body>

</html>

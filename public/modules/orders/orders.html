<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zylox POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../core/styles.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-transparent text-white font-sans overflow-hidden selection:bg-[#39FF14]/30">

    <div id="app" class="h-screen flex flex-col relative">

        <div id="view-home"
            class="absolute inset-0 flex flex-col p-6 animate-fade-in z-50 overflow-y-auto justify-center bg-zinc-900/10 backdrop-blur-sm">
            <div class="max-w-6xl mx-auto w-full space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="OrdersUI.startPosWizard()"
                        class="group relative bg-zinc-900/80 border border-zinc-800 p-6 hover:border-[#39FF14] transition-all text-left cyber-shape backdrop-blur-md">
                        <div class="absolute top-4 right-4 text-zinc-700 group-hover:text-[#39FF14] transition-colors">
                            <i class="ph ph-t-shirt text-4xl"></i></div>
                        <h2
                            class="text-2xl font-black text-white uppercase italic mb-2 group-hover:text-[#39FF14] tracking-tighter">
                            Venta Individual</h2>
                        <p class="text-xs text-zinc-500 font-mono">Paso a paso. Selección detallada.</p>
                    </button>
                    <button onclick="OrdersUI.startComboWizard()"
                        class="group relative bg-zinc-900/80 border border-zinc-800 p-6 hover:border-yellow-400 transition-all text-left cyber-shape backdrop-blur-md">
                        <div class="absolute top-4 right-4 text-zinc-700 group-hover:text-yellow-400"><i
                                class="ph ph-package text-4xl"></i></div>
                        <h2 class="text-2xl font-black text-white uppercase italic mb-2 group-hover:text-yellow-400">
                            Combos</h2>
                        <p class="text-xs text-zinc-500 font-mono">Venta rápida de paquetes.</p>
                    </button>
                    <button onclick="OrdersUI.switchView('history')"
                        class="group relative bg-zinc-900/80 border border-zinc-800 p-6 hover:border-purple-500 transition-all text-left cyber-shape backdrop-blur-md">
                        <div class="absolute top-4 right-4 text-zinc-700 group-hover:text-purple-500"><i
                                class="ph ph-clock-counter-clockwise text-4xl"></i></div>
                        <h2 class="text-2xl font-black text-white uppercase italic mb-2 group-hover:text-purple-500">
                            Historial</h2>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-black/40 border border-zinc-800 p-4 flex items-center justify-between cyber-shape">
                        <div>
                            <div class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Total Órdenes</div>
                            <div id="stats-total-orders" class="text-2xl font-mono font-bold text-white">--</div>
                        </div>
                        <i class="ph ph-receipt text-zinc-700 text-2xl"></i>
                    </div>
                    <div class="bg-black/40 border border-zinc-800 p-4 flex items-center justify-between cyber-shape">
                        <div>
                            <div class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Ventas Manuales</div>
                            <div id="stats-manual-orders" class="text-2xl font-mono font-bold text-[#39FF14]">--</div>
                        </div>
                        <i class="ph ph-hand-coins text-zinc-700 text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-pos" class="absolute inset-0 hidden flex-col p-4 overflow-hidden bg-black/50">

            <div id="step-1" class="h-full flex flex-col gap-4 animate-fade-in hidden">
                <div class="bg-zinc-900/80 border border-zinc-800 p-3 flex gap-3 cyber-shape">
                    <div class="relative flex-1">
                        <i class="ph ph-magnifying-glass absolute left-3 top-3 text-zinc-500"></i>
                        <input type="text" id="pos-search" placeholder="BUSCAR PRODUCTO..." oninput="OrdersUI.filterStep1(this.value)"
                            class="w-full bg-black/50 border border-zinc-700 p-2 pl-9 text-white text-xs font-mono outline-none focus:border-[#39FF14] uppercase">
                    </div>
                </div>
                <div id="step1-grid"
                    class="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 content-start pb-20 no-scrollbar">
                </div>
                <div class="absolute bottom-6 right-6 z-20">
                    <button onclick="WizardLogic.nextStep()" id="btn-next-1"
                        class="bg-[#39FF14] text-black font-black uppercase tracking-widest px-8 py-4 cyber-shape hover:bg-white transition-all shadow-lg shadow-green-500/20 disabled:opacity-50 disabled:cursor-not-allowed">
                        Siguiente Paso <i class="ph ph-caret-right ml-2"></i>
                    </button>
                </div>
            </div>

            <div id="step-2" class="h-full flex flex-col gap-4 animate-fade-in hidden">
                <div class="text-center mb-2">
                    <h3 class="text-[#39FF14] font-mono text-xs uppercase tracking-[0.2em]">Configuración de Items</h3>
                </div>
                <div id="step2-list"
                    class="flex-1 overflow-y-auto space-y-3 pb-20 max-w-4xl mx-auto w-full no-scrollbar"></div>
                <div class="absolute bottom-6 right-6 z-20">
                    <button onclick="WizardLogic.nextStep()"
                        class="bg-[#39FF14] text-black font-black uppercase tracking-widest px-8 py-4 cyber-shape hover:bg-white transition-all shadow-lg shadow-green-500/20">
                        Siguiente Paso <i class="ph ph-caret-right ml-2"></i>
                    </button>
                </div>
            </div>

            <div id="step-3" class="h-full flex flex-col gap-4 animate-fade-in hidden max-w-5xl mx-auto w-full">
                <div
                    class="bg-zinc-900/80 border border-zinc-800 flex-1 cyber-shape flex flex-col overflow-hidden relative">
                    <div class="p-4 bg-black/40 border-b border-zinc-800 flex justify-between items-center">
                        <span class="font-bold text-white uppercase tracking-widest">Resumen del Pedido</span>
                        <button onclick="CartManager.clearAll()"
                            class="text-red-500 text-xs hover:text-white uppercase">Vaciar Todo</button>
                    </div>
                    <div id="step3-cart-list" class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar"></div>
                    <div class="p-4 bg-black/60 border-t border-zinc-800 text-right">
                        <span class="text-zinc-500 text-xs uppercase mr-2">Subtotal Parcial:</span>
                        <span id="step3-subtotal" class="text-2xl font-mono text-[#39FF14] font-bold">$0</span>
                    </div>
                </div>
                <div class="flex justify-end">
                    <button onclick="WizardLogic.nextStep()"
                        class="bg-[#39FF14] text-black font-black uppercase tracking-widest px-8 py-4 cyber-shape hover:bg-white transition-all shadow-lg shadow-green-500/20">
                        Confirmar Carrito <i class="ph ph-check ml-2"></i>
                    </button>
                </div>
            </div>

            <div id="step-4"
                class="h-full flex flex-col animate-fade-in hidden max-w-3xl mx-auto w-full justify-center">
                <div class="bg-zinc-900/90 border border-zinc-800 p-8 space-y-8 shadow-2xl backdrop-blur-xl relative">
                    <div class="absolute top-0 left-0 w-4 h-4 border-t border-l border-[#39FF14]"></div>
                    <div class="absolute bottom-0 right-0 w-4 h-4 border-b border-r border-[#39FF14]"></div>

                    <div class="border-b border-zinc-800 pb-4 mb-4">
                        <h2 class="text-2xl font-black italic text-white uppercase">Cierre de Venta</h2>
                        <p class="text-xs text-zinc-500 font-mono">Ajuste final y facturación</p>
                    </div>

                    <div class="grid grid-cols-2 gap-8 mt-6">
                        <div class="space-y-4">
                            <div class="relative">
                                <label
                                    class="block text-[10px] text-[#39FF14] uppercase font-bold mb-2 tracking-widest">Total
                                    a Cobrar</label>
                                <input type="number" id="final-total" oninput="CartManager.recalcFinal()"
                                    class="w-full bg-zinc-950 border border-zinc-700 p-4 text-right text-[#39FF14] font-mono font-bold text-xl outline-none focus:border-[#39FF14] cyber-shape">
                            </div>
                            <div class="flex justify-between text-[10px] font-mono text-zinc-500 px-1">
                                <span>Sugerido:</span>
                                <span id="suggested-total" class="text-white">$0</span>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <div class="relative">
                                <label
                                    class="block text-[10px] text-green-500 uppercase font-bold mb-2 tracking-widest">Ganancia
                                    Real</label>
                                <input type="number" id="final-profit"
                                    class="w-full bg-zinc-950 border border-zinc-700 p-4 text-right text-green-500 font-mono font-bold text-xl outline-none focus:border-green-500 cyber-shape">
                            </div>
                            <div class="flex justify-between text-[10px] font-mono text-zinc-500 px-1">
                                <span>Diferencia:</span>
                                <span id="profit-diff" class="text-zinc-400">$0</span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <label class="block text-[10px] text-white uppercase font-bold mb-2 tracking-widest">Datos del
                            Cliente</label>
                        <input type="text" id="final-client"
                            class="w-full bg-zinc-950 border border-zinc-700 p-4 text-white font-mono text-sm outline-none focus:border-white cyber-shape uppercase placeholder-zinc-700"
                            placeholder="CONSUMIDOR FINAL">
                    </div>

                    <button onclick="CartManager.submitOrder()" id="btn-submit-order"
                        class="w-full py-5 bg-[#39FF14] text-black font-black uppercase text-xl tracking-widest hover:bg-white transition-all shadow-[0_0_30px_rgba(57,255,20,0.4)] cyber-shape mt-4">
                        COBRAR Y FINALIZAR
                    </button>
                </div>
            </div>

        </div>

        <div id="view-history" class="absolute inset-0 hidden flex-col p-4 pt-4 overflow-hidden">
            <div class="flex justify-between items-center mb-4 border-b border-zinc-800 pb-2">
                <h2 class="text-xl font-bold text-white uppercase italic">Historial</h2>
                <button onclick="OrdersUI.loadHistory()"
                    class="text-xs text-[#39FF14] hover:underline">Refrescar</button>
            </div>
            <div id="history-container" class="flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pb-20 no-scrollbar content-start"></div>
        </div>

    </div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pos-logic.js"></script>
    <script src="js/boot.js"></script>
</body>

</html>

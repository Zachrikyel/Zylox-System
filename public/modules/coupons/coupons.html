<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zylox Galactics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../core/styles.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="bg-transparent text-white font-sans overflow-hidden selection:bg-[#39FF14]/30">

    <div id="app" class="h-screen flex flex-col relative">

        <div id="view-home"
            class="absolute inset-0 flex flex-col p-6 animate-fade-in z-50 overflow-y-auto justify-center bg-zinc-900/10 backdrop-blur-sm">
            <div class="max-w-5xl mx-auto w-full space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <button onclick="CouponsUI.switchView('new')"
                        class="group relative bg-zinc-900/80 border border-zinc-800 p-8 hover:border-[#39FF14] transition-all text-left cyber-shape backdrop-blur-md overflow-hidden">
                        <div
                            class="absolute -top-2 -right-2 text-zinc-800 group-hover:text-[#39FF14]/20 transition-colors transform group-hover:scale-110 duration-500">
                            <i class="ph ph-ticket text-9xl opacity-50"></i>
                        </div>
                        <div class="relative z-10 pr-10">
                            <h2
                                class="text-3xl font-black text-white uppercase italic mb-2 group-hover:text-[#39FF14] tracking-tighter shadow-black drop-shadow-md">
                                Nuevo Código</h2>
                            <p class="text-xs text-zinc-500 font-mono group-hover:text-zinc-300">Crear cupones de
                                descuento, promociones y accesos especiales.</p>
                        </div>
                    </button>
                    <button onclick="CouponsUI.switchView('list')"
                        class="group relative bg-zinc-900/80 border border-zinc-800 p-8 hover:border-purple-500 transition-all text-left cyber-shape backdrop-blur-md overflow-hidden">
                        <div
                            class="absolute -top-2 -right-2 text-zinc-800 group-hover:text-purple-500/20 transition-colors transform group-hover:scale-110 duration-500">
                            <i class="ph ph-list-dashes text-9xl opacity-50"></i>
                        </div>
                        <div class="relative z-10 pr-10">
                            <h2
                                class="text-3xl font-black text-white uppercase italic mb-2 group-hover:text-purple-500 tracking-tighter shadow-black drop-shadow-md">
                                Gestión de Códigos</h2>
                            <p class="text-xs text-zinc-500 font-mono group-hover:text-zinc-300">Historial,
                                desactivación y métricas de uso.</p>
                        </div>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div
                        class="bg-black/40 border border-zinc-800 p-4 flex items-center justify-between cyber-shape group hover:border-[#39FF14] transition-colors">
                        <div>
                            <div
                                class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1 group-hover:text-[#39FF14]">
                                Activos</div>
                            <div id="stats-active" class="text-2xl font-mono font-bold text-[#39FF14]">--</div>
                        </div>
                        <i
                            class="ph ph-check-circle text-zinc-700 text-3xl group-hover:text-[#39FF14] transition-colors"></i>
                    </div>
                    <div
                        class="bg-black/40 border border-zinc-800 p-4 flex items-center justify-between cyber-shape group hover:border-white transition-colors">
                        <div>
                            <div
                                class="text-[10px] text-zinc-500 uppercase tracking-widest mb-1 group-hover:text-white">
                                Canjeados (Total)</div>
                            <div id="stats-redeemed" class="text-2xl font-mono font-bold text-white">--</div>
                        </div>
                        <i class="ph ph-trend-up text-zinc-700 text-3xl group-hover:text-white transition-colors"></i>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-new" class="absolute inset-0 hidden flex-col p-6 animate-fade-in bg-black/50 overflow-y-auto">
            <div
                class="max-w-3xl mx-auto w-full mt-6 bg-zinc-900/90 border border-zinc-800 cyber-shape p-8 shadow-2xl backdrop-blur-xl relative">
                <div
                    class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-bl from-[#39FF14]/10 to-transparent pointer-events-none">
                </div>
                <div class="flex justify-between items-start mb-8 border-b border-zinc-800 pb-4">
                    <div>
                        <h2 class="text-2xl font-black italic text-white uppercase tracking-tighter">Crear Código</h2>
                        <p class="text-xs text-zinc-500 font-mono">Configuración de parámetros promocionales.</p>
                    </div>
                    <div class="flex flex-col items-end pt-2">
                        <button id="switch-active" onclick="CouponsManager.toggleActive()"
                            class="w-14 h-7 bg-[#39FF14]/20 border border-[#39FF14] rounded-full relative transition-all"
                            data-active="true">
                            <div class="absolute top-1 right-1 w-4 h-4 bg-[#39FF14] rounded-full shadow-[0_0_10px_#39FF14] transition-all"
                                id="switch-knob"></div>
                        </button>
                        <span id="switch-label" class="text-[9px] text-[#39FF14] font-bold mt-1 uppercase">Activo</span>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2 space-y-2">
                            <label class="text-[10px] text-[#39FF14] uppercase font-bold tracking-widest">Código
                                (Identificador)</label>
                            <div class="relative">
                                <i class="ph ph-hash absolute left-4 top-4 text-zinc-500 text-xl"></i>
                                <input type="text" id="input-code"
                                    class="w-full bg-zinc-950 border border-zinc-700 p-4 pl-12 text-white font-mono text-xl uppercase font-bold outline-none focus:border-[#39FF14] cyber-shape placeholder-zinc-700"
                                    placeholder="EJ: PROMO2026">
                            </div>
                            <p class="text-[9px] text-zinc-600 font-mono">* Solo letras y números. Se convertirá a
                                mayúsculas.</p>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] text-white uppercase font-bold tracking-widest">Descuento
                                (%)</label>
                            <div class="relative">
                                <i class="ph ph-percent absolute right-4 top-4 text-zinc-500 text-xl"></i>
                                <input type="number" id="input-discount"
                                    class="w-full bg-zinc-950 border border-zinc-700 p-4 text-right text-[#39FF14] font-mono text-xl font-bold outline-none focus:border-[#39FF14] cyber-shape"
                                    placeholder="0">
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-black/20 p-4 border border-zinc-800/50">
                        <div class="space-y-2">
                            <label class="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Límite de
                                Usos</label>
                            <input type="number" id="input-max-uses"
                                class="w-full bg-zinc-900 border border-zinc-700 p-3 text-white font-mono text-sm outline-none focus:border-white"
                                placeholder="Ej: 100">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Fecha
                                Vencimiento</label>
                            <input type="datetime-local" id="input-expires"
                                class="w-full bg-zinc-900 border border-zinc-700 p-3 text-white font-mono text-sm outline-none focus:border-white">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Restringir a
                                Usuario</label>
                            <div class="relative">
                                <select id="select-user"
                                    class="w-full bg-zinc-950 border border-zinc-800 p-3 text-zinc-300 font-mono text-xs outline-none focus:border-white appearance-none">
                                    <option value="">-- Para Todos los Usuarios --</option>
                                    <option disabled>Cargando...</option>
                                </select>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Notas
                                Internas</label>
                            <input type="text" id="input-notes"
                                class="w-full bg-zinc-950 border border-zinc-800 p-3 text-zinc-300 font-mono text-xs outline-none focus:border-white"
                                placeholder="Ej: Campaña Instagram Enero">
                        </div>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-zinc-800 flex justify-end">
                    <button onclick="CouponsManager.createCode()" id="btn-create"
                        class="w-full md:w-auto px-8 py-3 bg-[#39FF14] text-black font-black uppercase tracking-widest hover:bg-white transition-all shadow-[0_0_20px_rgba(57,255,20,0.3)] cyber-shape">
                        Generar Código
                    </button>
                </div>
            </div>
        </div>

        <div id="view-list"
            class="absolute inset-0 hidden flex-col p-6 animate-fade-in bg-zinc-900/50 backdrop-blur-sm overflow-hidden">
            <div class="flex justify-between items-center mb-6 max-w-6xl mx-auto w-full">
                <h2 class="text-2xl font-black italic text-white uppercase tracking-tighter">Archivo de Códigos</h2>
                <button onclick="CouponsUI.loadCouponsList()"
                    class="text-xs text-[#39FF14] hover:underline uppercase font-bold tracking-widest">
                    <i class="ph ph-arrows-clockwise"></i> Refrescar
                </button>
            </div>
            <div id="coupons-grid"
                class="flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 content-start pb-20 max-w-6xl mx-auto w-full no-scrollbar">
            </div>
        </div>

        <div id="edit-modal"
            class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-md hidden items-center justify-center p-4">
            <div
                class="bg-zinc-900 border border-zinc-700 w-full max-w-2xl shadow-2xl relative animate-fade-in cyber-shape p-1 overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 to-[#39FF14]"></div>

                <div class="p-8 space-y-6 bg-black/40 h-full max-h-[90vh] overflow-y-auto">
                    <div class="flex justify-between items-start border-b border-zinc-800 pb-4">
                        <div>
                            <h3 class="text-xl font-black italic text-white uppercase tracking-tighter">Editar Código
                            </h3>
                            <span id="edit-id-display" class="text-[10px] text-zinc-500 font-mono">ID: --</span>
                        </div>
                        <div class="flex flex-col items-end pt-1">
                            <button id="edit-switch-active" onclick="CouponsManager.toggleEditActive()"
                                class="w-12 h-6 bg-zinc-800 border border-zinc-600 rounded-full relative transition-all">
                                <div class="absolute top-1 left-1 w-4 h-4 bg-zinc-500 rounded-full transition-all"
                                    id="edit-switch-knob"></div>
                            </button>
                            <span id="edit-switch-label"
                                class="text-[8px] text-zinc-500 font-bold mt-1 uppercase">Inactivo</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-[9px] text-[#39FF14] uppercase font-bold">Código</label>
                                <input type="text" id="edit-code"
                                    class="w-full bg-zinc-950 border border-zinc-700 p-3 text-white font-mono uppercase font-bold outline-none focus:border-[#39FF14]">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] text-white uppercase font-bold">Descuento (%)</label>
                                <input type="number" id="edit-discount"
                                    class="w-full bg-zinc-950 border border-zinc-700 p-3 text-right text-[#39FF14] font-mono font-bold outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 bg-zinc-900/50 p-3 border border-zinc-800">
                            <div class="space-y-1">
                                <label class="text-[9px] text-zinc-400 uppercase font-bold">Límite Usos</label>
                                <input type="number" id="edit-max-uses"
                                    class="w-full bg-zinc-800 border border-zinc-700 p-2 text-white font-mono text-xs outline-none">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[9px] text-zinc-400 uppercase font-bold">Vencimiento</label>
                                <input type="datetime-local" id="edit-expires"
                                    class="w-full bg-zinc-800 border border-zinc-700 p-2 text-white font-mono text-xs outline-none">
                            </div>
                        </div>

                        <div class="space-y-1">
                            <label class="text-[9px] text-zinc-500 uppercase font-bold">Usuario Restringido</label>
                            <select id="edit-select-user"
                                class="w-full bg-zinc-950 border border-zinc-800 p-3 text-zinc-300 font-mono text-xs outline-none appearance-none">
                                <option value="">-- Todos --</option>
                            </select>
                        </div>

                        <div class="space-y-1">
                            <label class="text-[9px] text-zinc-500 uppercase font-bold">Notas</label>
                            <input type="text" id="edit-notes"
                                class="w-full bg-zinc-950 border border-zinc-800 p-3 text-zinc-400 font-mono text-xs outline-none">
                        </div>
                    </div>

                    <div class="pt-4 border-t border-zinc-800">
                        <button onclick="CouponsManager.updateCode()" id="btn-update"
                            class="w-full py-4 bg-[#39FF14] text-black font-black uppercase tracking-widest hover:bg-white transition-all cyber-shape shadow-lg shadow-green-500/20">
                            Actualizar Código
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/boot.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zylox Cuentas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../../core/styles.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-transparent text-white font-sans overflow-hidden selection:bg-[#39FF14]/30">

    <div id="app" class="h-screen flex flex-col relative">

        <div id="view-home"
            class="absolute inset-0 flex flex-col p-6 animate-fade-in z-50 overflow-y-auto justify-center bg-zinc-900/10 backdrop-blur-sm">
            <div class="max-w-3xl mx-auto w-full space-y-6">
                <div class="text-center mb-2">
                    <div class="text-5xl mb-2">🐈‍⬛</div>
                    <h1 class="text-xl font-black uppercase italic tracking-tighter text-cyan-400">Cuentas</h1>
                    <p class="text-[10px] text-zinc-600 font-mono uppercase">Michi vigila el inventario y la plata</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onclick="CuentasUI.switchView('inventory')"
                        class="group relative bg-zinc-900/80 border border-zinc-800 p-6 hover:border-cyan-500 transition-all text-left cyber-shape backdrop-blur-md">
                        <div class="absolute top-4 right-4 text-zinc-700 group-hover:text-cyan-400 transition-colors">
                            <i class="ph ph-cube text-4xl"></i></div>
                        <h2 class="text-2xl font-black text-white uppercase italic mb-2 group-hover:text-cyan-400 tracking-tighter">
                            Inventario</h2>
                        <p class="text-xs text-zinc-500 font-mono">Cuánto te alcanza, por producto.</p>
                    </button>
                    <button onclick="CuentasUI.switchView('dashboard')"
                        class="group relative bg-zinc-900/80 border border-zinc-800 p-6 hover:border-purple-500 transition-all text-left cyber-shape backdrop-blur-md">
                        <div class="absolute top-4 right-4 text-zinc-700 group-hover:text-purple-500 transition-colors">
                            <i class="ph ph-chart-donut text-4xl"></i></div>
                        <h2 class="text-2xl font-black text-white uppercase italic mb-2 group-hover:text-purple-500 tracking-tighter">
                            Dashboard</h2>
                        <p class="text-xs text-zinc-500 font-mono">Ganancia, ganancia real, costo operativo.</p>
                    </button>
                </div>
            </div>
        </div>

        <div id="view-inventory" class="absolute inset-0 hidden flex-col animate-fade-in z-40">
            <div class="p-4 border-b border-zinc-800 flex items-center gap-3">
                <button onclick="CuentasUI.switchView('home')" class="text-zinc-500 hover:text-white"><i class="ph ph-arrow-left text-xl"></i></button>
                <input type="text" id="inventory-search" oninput="CuentasUI.filterInventory(this.value)" placeholder="Buscar producto..."
                    class="flex-1 bg-zinc-900 border border-zinc-800 px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" />
            </div>
            <div id="inventory-container" class="flex-1 overflow-y-auto p-4 space-y-2 pb-24"></div>
        </div>

        <div id="view-dashboard" class="absolute inset-0 hidden flex-col animate-fade-in z-40">
            <div class="p-4 border-b border-zinc-800 flex items-center gap-3 sticky top-0 bg-black/80 backdrop-blur-md z-10">
                <button onclick="CuentasUI.switchView('home')" class="text-zinc-500 hover:text-white"><i class="ph ph-arrow-left text-xl"></i></button>
                <div class="relative flex-1">
                    <button id="month-picker-btn" onclick="CuentasUI.toggleMonthPicker()"
                        class="bg-zinc-900 border border-zinc-800 px-4 py-2 text-xs text-white font-mono uppercase tracking-wider hover:border-purple-500 transition-colors flex items-center gap-2 w-full justify-between">
                        <span id="month-picker-label">—</span>
                        <i class="ph ph-caret-down text-zinc-500"></i>
                    </button>
                    <div id="month-picker-dropdown" class="hidden absolute top-full left-0 right-0 mt-1 bg-zinc-950 border border-zinc-700 shadow-xl shadow-black/50 z-50">
                        <div class="flex items-center justify-between p-2 border-b border-zinc-800">
                            <button onclick="CuentasUI.changePickerYear(-1)" class="w-8 h-8 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">
                                <i class="ph ph-caret-left"></i>
                            </button>
                            <span id="picker-year-label" class="text-sm font-bold text-purple-400 font-mono"></span>
                            <button onclick="CuentasUI.changePickerYear(1)" class="w-8 h-8 flex items-center justify-center text-zinc-400 hover:text-white hover:bg-zinc-800 transition-colors">
                                <i class="ph ph-caret-right"></i>
                            </button>
                        </div>
                        <div id="picker-months-grid" class="grid grid-cols-3 gap-1 p-2"></div>
                    </div>
                </div>
                <!-- hidden input to hold the value -->
                <input type="hidden" id="dashboard-month" />
            </div>
            <div id="dashboard-container" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24"></div>
            <button onclick="CuentasUI.openMovementForm()"
                class="fixed bottom-24 right-6 bg-purple-500 text-black w-14 h-14 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(168,85,247,0.5)] hover:bg-purple-400 transition-colors z-50 cursor-pointer">
                <i class="ph ph-plus text-2xl font-bold"></i>
            </button>
        </div>

    </div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/boot.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zylox Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../materials/style.css">
    <style>
        /* Ajuste para que el input de edición se vea bien */
        .edit-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            color: white;
            width: 100%;
            padding: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            margin-bottom: 15px;
        }

        .edit-input:focus {
            border-color: var(--dynamic-color, #fff);
        }
    </style>
</head>

<body>

    <div id="root">
        <div class="flex h-full items-center justify-center">
            <i class="fas fa-circle-notch fa-spin text-3xl text-[#39FF14]"></i>
        </div>
    </div>

    <div id="create-modal" class="modal-overlay hidden">
        <div class="modal-sheet relative border-t-2" id="modal-sheet-border" style="border-color: #39FF14;">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white uppercase italic">
                    Nueva <span class="text-[#39FF14]">Categoría</span>
                </h3>
                <button type="button" onclick="window.closeModal()" class="text-zinc-500 hover:text-white">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <form onsubmit="event.preventDefault(); window.submitCreation();">
                <div class="mb-4 text-xs font-mono text-zinc-500 border-b border-zinc-800 pb-2">
                    UBICACIÓN: <span id="modal-context-path" class="text-white font-bold">CATEGORÍAS</span>
                </div>

                <label class="text-xs text-[#39FF14] mb-1 block uppercase tracking-wider">Nombre</label>
                <input type="text" id="input_name" class="input-cyber" placeholder="NOMBRE..." required
                    autocomplete="off" oninput="window.generateSlug(this.value)">

                <div class="flex items-center gap-3 mb-6 bg-zinc-900/50 p-3 border border-zinc-800 rounded">
                    <i class="fas fa-link text-[#39FF14]"></i>
                    <div class="flex flex-col w-full">
                        <span class="text-[10px] text-zinc-500 uppercase">Slug</span>
                        <input type="text" id="input_slug"
                            class="bg-transparent border-none text-white font-mono text-sm w-full outline-none"
                            readonly>
                    </div>
                </div>

                <button type="submit" class="btn-full bg-[#39FF14] text-black">CREAR NODO</button>
            </form>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-sheet relative border-t-2" id="edit-sheet-border">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white uppercase italic">Editar Nodo</h3>
                <button type="button" onclick="document.getElementById('edit-modal').classList.add('hidden')"
                    class="text-zinc-500">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>

            <form onsubmit="event.preventDefault(); window.submitEdit();">
                <input type="hidden" id="edit_id">

                <label class="text-xs text-zinc-500 mb-1 block uppercase tracking-wider">Nombre de Categoría</label>
                <input type="text" id="edit_name_input" class="edit-input" autocomplete="off">

                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="window.deleteCategory()"
                        class="flex-1 py-3 bg-red-900/20 text-red-500 border border-red-900/50 hover:bg-red-900/40 font-bold uppercase text-xs">
                        <i class="fas fa-trash mr-2"></i> Eliminar
                    </button>
                    <button type="submit" id="btn-save-edit"
                        class="flex-[2] py-3 text-black font-bold uppercase text-xs shadow-lg transition-all">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/boot.js"></script>
    <script>window.closeModal = () => document.getElementById('create-modal')?.classList.add('hidden');</script>
</body>

</html>

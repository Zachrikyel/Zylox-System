<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { cyan: { 450: '#06b6d4' } } } } }
    </script>
</head>

<body class="bg-transparent text-white overflow-y-auto no-scrollbar p-4">

    <div class="max-w-md mx-auto space-y-6 pb-20">

        <div class="glass-panel p-5 rounded-xl">
            <h3 class="text-cyan-400 text-xs font-bold uppercase tracking-wider mb-4 border-b border-white/10 pb-2">
                Material</h3>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Costo Rollo ($)</label>
                    <input type="number" id="costoRollo" value="80000" class="input-field">
                </div>
                <div>
                    <label class="label-text">Peso Rollo (g)</label>
                    <input type="number" id="pesoRollo" value="1000" class="input-field">
                </div>
            </div>
            <div class="mt-4">
                <label class="label-text">Gramos Usados</label>
                <div class="relative">
                    <input type="number" id="gramosPieza" placeholder="0"
                        class="input-field border-cyan-500/50 text-lg font-bold text-center">
                    <span class="absolute right-3 top-3 text-zinc-500 text-sm">g</span>
                </div>
            </div>
        </div>

        <div class="glass-panel p-5 rounded-xl">
            <h3 class="text-purple-400 text-xs font-bold uppercase tracking-wider mb-4 border-b border-white/10 pb-2">
                Recursos</h3>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="label-text">Horas</label>
                    <input type="number" id="horas" value="0" class="input-field text-center">
                </div>
                <div>
                    <label class="label-text">Minutos</label>
                    <input type="number" id="minutos" value="0" class="input-field text-center">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Costo kWh ($)</label>
                    <input type="number" id="costoKwh" value="800" class="input-field text-xs">
                </div>
                <div>
                    <label class="label-text">Consumo (W)</label>
                    <input type="number" id="watts" value="150" class="input-field text-xs">
                </div>
            </div>
        </div>

        <div class="glass-panel p-5 rounded-xl">
            <h3 class="text-green-400 text-xs font-bold uppercase tracking-wider mb-4 border-b border-white/10 pb-2">
                Negocio</h3>
            <div class="mb-2 flex justify-between">
                <label class="label-text">Margen de Ganancia</label>
                <span id="margenValor" class="text-green-400 font-mono text-sm">200%</span>
            </div>
            <input type="range" id="margen" min="0" max="500" value="200"
                class="w-full h-2 bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-green-500">

            <div class="mt-4 grid grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Desgaste Máquina</label>
                    <input type="number" id="depreciacion" value="2000" class="input-field text-xs">
                </div>
                <div>
                    <label class="label-text">Fallo (%)</label>
                    <input type="number" id="tasaFallo" value="10" class="input-field text-xs">
                </div>
            </div>
        </div>

        <div class="bg-zinc-900 border border-zinc-700 p-6 rounded-2xl relative overflow-hidden shadow-2xl">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500">
            </div>

            <div class="space-y-2 mb-4 text-xs text-zinc-400">
                <div class="flex justify-between"><span>Material:</span> <span id="resMaterial"
                        class="text-white font-mono">$0</span></div>
                <div class="flex justify-between"><span>Energía:</span> <span id="resLuz"
                        class="text-white font-mono">$0</span></div>
                <div class="flex justify-between"><span>Depreciación:</span> <span id="resDepre"
                        class="text-white font-mono">$0</span></div>
            </div>

            <div class="border-t border-zinc-700 pt-4 flex justify-between items-center">
                <span class="text-sm font-bold text-zinc-300">PRECIO SUGERIDO</span>
                <span id="resTotal"
                    class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-green-400">$0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
